[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-ai-usage"
version = "0.2.0"
description = "DankMaterialShell usage widget for multiple Claude and Codex subscriptions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "dms-ai-usage contributors"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
dms-ai-usage = "dms_ai_usage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
